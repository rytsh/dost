name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: python3 scripts/i18n-keys.py all
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows:
    name: Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --target ${{ matrix.target }} update::tests
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: Copy-Item target/${{ matrix.target }}/release/dost.exe dost.exe
      # Signed only when the certificate is set up (repo secrets WINDOWS_CERT_PFX as base64,
      # WINDOWS_CERT_PASSWORD); otherwise the exe stays unsigned.
      - name: Sign
        if: env.WINDOWS_CERT_PFX != ''
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dost.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows code signing failed" }
          & $signtool.FullName verify /pa /v dost.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows signature verification failed" }
          Remove-Item cert.pfx
      - name: Package
        run: python scripts/release.py package --os Windows --arch ${{ matrix.arch }} --binary dost.exe
      - uses: actions/upload-artifact@v4
        with:
          name: dost-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test update::tests
      - run: cargo build --locked --release
      - name: Package
        run: python3 scripts/release.py package --os Linux --arch ${{ matrix.arch }} --binary target/release/dost
      - uses: actions/upload-artifact@v4
        with:
          name: dost-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      # Only release tags use Developer ID signing and Apple's notarization service.
      # Branch/PR artifacts are ad-hoc signed, even when secrets are available.
      - name: Check release signing credentials
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing release signing secret: $name"
              exit 1
            fi
          done
      - name: Import certificate
        if: startsWith(github.ref, 'refs/tags/v') && env.MACOS_CERT_P12 != ''
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
          echo "SIGN_ID=$(security find-identity -v -p codesigning build.keychain | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning build.keychain | grep -q 'Developer ID Application'
      - run: brew install create-dmg
      - run: make dmg SIGN_ID="${SIGN_ID:--}" MAC_TARGETS="aarch64-apple-darwin x86_64-apple-darwin"
      # Keep the installer universal, but build/sign each update bundle independently.
      # Include each exact signed output in the batch instead of relying on hash reuse after thinning.
      - name: Build architecture-specific apps
        run: |
          for spec in arm64:aarch64-apple-darwin x86_64:x86_64-apple-darwin; do
            arch="${spec%%:*}"
            target="${spec#*:}"
            app="target/macos/$arch/Dost.app"
            make app APP="$app" SIGN_ID="${SIGN_ID:--}" MAC_TARGETS="$target"
            test "$(lipo -archs "$app/Contents/MacOS/dost")" = "$arch"
          done
      - name: Prepare one signed notarization batch
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 scripts/notarize_macos.py prepare --dmg target/Dost-*.dmg
      # Checkpoint first: never lose the exact signed inputs while waiting for Apple.
      - name: Save signed recovery inputs before submitting
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: macos-notary-inputs-${{ github.run_attempt }}
          path: target/notary-inputs/*
          if-no-files-found: error
          retention-days: 30
      - name: Submit once without waiting
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/notarize_macos.py submit
      - name: Save Apple submission UUID immediately
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: macos-notary-submission-${{ github.run_attempt }}
          path: target/notary-submission/submission.json
          if-no-files-found: error
          retention-days: 30
      - name: Package architecture-specific apps
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          mkdir -p dist
          cp target/Dost-*.dmg dist/dost.dmg
          for arch in arm64 x86_64; do
            app="target/macos/$arch/Dost.app"
            archive="dist/dost_Darwin_$arch.tar.gz"
            tar -czf "$archive" -C "$(dirname "$app")" Dost.app
            # Verify the delivered archive, not just the bundle before compression.
            verify="target/macos/$arch/verify"
            mkdir -p "$verify"
            tar -xzf "$archive" -C "$verify"
            codesign --verify --strict --verbose=2 "$verify/Dost.app"
            test "$(lipo -archs "$verify/Dost.app/Contents/MacOS/dost")" = "$arch"
          done
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: dost-macos
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, linux, macos]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/notarization.yml
    with:
      source_run_id: ${{ github.run_id }}
      source_attempt: ${{ github.run_attempt }}
    secrets: inherit
